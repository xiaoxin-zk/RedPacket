name: RedPacket
version: ${project.version}
main: sandtechnology.redpacket.RedPacketPlugin
api-version: 1.20
prefix: RedPacket
authors: [ sandtechnology ]
description: RedPacket
softdepend: [ Vault, PlayerPoints ]
commands:
  RedPacket:
    permission: redpacket
    description: RedPacket
    usage: /RedPacket [new|get|help]
    aliases:
      - fhb
      - RP
      - rp
permissions:
  redpacket.admin:
    default: op
    children:
      redpacket.user: true
      redpacket.command.reload: true
  redpacket:
    default: true
  redpacket.command.new:
    default: true
  redpacket.command.get:
    default: true
  redpacket.command.session:
    default: true
  redpacket.command.reload:
    default: op

  redpacket.chat.color:
    default: op
    description: 允许在聊天中使用颜色代码

  redpacket.set.commonredpacket:
    default: true
  redpacket.set.jielongredpacket:
    default: true
  redpacket.set.passwordredpacket:
    default: true
  redpacket.get.commonredpacket:
    default: true
  redpacket.get.jielongredpacket:
    default: true
  redpacket.get.passwordredpacket:
    default: true

  redpacket.user:
    default: true
    children:
      redpacket: true
      redpacket.command.new: true
      redpacket.command.get: true
      redpacket.command.session: true
      redpacket.get.commonredpacket: true
      redpacket.get.jielongredpacket: true
      redpacket.get.passwordredpacket: true
      redpacket.set.commonredpacket: true
      redpacket.set.jielongredpacket: true
      redpacket.set.passwordredpacket: true

